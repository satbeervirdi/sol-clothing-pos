name: Keep Render POS Awake

on:
  schedule:
    # Runs every 10 minutes, 24/7/365
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping POS Server
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP request to Render
        run: |
          echo "Sending keep-alive ping to Render POS..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --max-time 30 https://sol-clothing-pos.onrender.com/)
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Render POS is awake and active!"
          else
            echo "Ping completed with status $HTTP_STATUS"
          fi
